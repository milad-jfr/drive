name: Download and Chunk Drive File

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      drive_link:
        description: "Google Drive link"
        required: true


jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install gdown
        run: pip install gdown

      - name: Download file
        run: |
          gdown "${{ github.event.inputs.drive_link }}" -O file.bin

      - name: Split file
        run: |
          split -b 90M file.bin part_

      - name: Commit parts
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add part_*
          git commit -m "upload chunks"
          git push
