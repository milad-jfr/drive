name: Mega Download + Chunked Release Upload (Fixed File)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Install megacmd
        run: |
          sudo apt update
          sudo apt install -y wget zip unzip
          wget https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb -O megacmd.deb
          sudo apt install -y ./megacmd.deb
          rm -f megacmd.deb

      - name: Download Mega file
        run: |
          mega-get "https://mega.nz/file/DJdCBahI#QKwCMIwZEv0GxNM4F7BbN5ambcIQoGfF99CcoR4RdaU" .

          if [ ! -f "ks_full_backup_2026.gz" ]; then
            echo "Download failed"
            exit 1
          fi

          ls -lh

      - name: Split file into safe chunks (<2GB)
        run: |
          FILE="ks_full_backup_2026.gz"

          echo "Splitting file into 1900MB chunks..."
          split -b 1900M "$FILE" chunk_

          echo "Chunks created:"
          ls -lh chunk_*

          rm -f "$FILE"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dataset-v1
          name: Dataset Release - dataset-v1
          draft: false
          prerelease: false

      - name: Upload chunks
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dataset-v1
          files: chunk_*
