name: Smart Persistent Worker

on:
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"

      - name: Worker Loop
        shell: bash
        run: |
          COMMAND_FILE="command.txt"
          HISTORY_FILE=".executed_commands.log"
          touch "$HISTORY_FILE"
          
          echo "Worker started. Monitoring $COMMAND_FILE..."

          while true; do
            # دریافت آخرین تغییرات از ریپو
            git pull --rebase origin main || true
            
            # خواندن خط به خط فایل دستورات
            if [ -f "$COMMAND_FILE" ]; then
              while IFS= read -r line || [[ -n "$line" ]]; do
                # حذف فضای خالی ابتدا و انتها
                line=$(echo "$line" | xargs)
                [[ -z "$line" ]] && continue
                [[ "$line" == "#"* ]] && continue # صرف نظر از کامنت‌ها

                # تولید هش از دستور برای شناسایی یکتایی
                cmd_hash=$(echo -n "$line" | sha256sum | cut -d' ' -f1)

                # اگر دستور قبلاً اجرا نشده باشد
                if ! grep -q "$cmd_hash" "$HISTORY_FILE"; then
                  echo ">>> اجرای دستور جدید: $line"
                  
                  # اجرای دستور
                  bash -c "$line" || echo "دستور با خطا مواجه شد."
                  
                  # ثبت در تاریخچه
                  echo "$cmd_hash" >> "$HISTORY_FILE"
                  git add "$HISTORY_FILE"
                  git commit -m "Marked command as executed: $cmd_hash" || true
                  git push origin main || true
                fi
              done < "$COMMAND_FILE"
            fi
            
            sleep 30
          done
