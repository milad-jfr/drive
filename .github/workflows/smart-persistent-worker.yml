name: Persistent Command Worker

on:
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Start Worker
        shell: bash
        run: |

          COMMAND_FILE="command.txt"
          HISTORY_FILE=".executed_commands.log"

          touch "$HISTORY_FILE"

          echo "Worker started..."

          while true
          do

            # دریافت آخرین نسخه repo بدون مشکل merge
            git fetch origin main
            git reset --hard origin/main

            if [ -f "$COMMAND_FILE" ]; then

              awk '/### COMMAND/{flag=1;next}/### END/{flag=0}flag' "$COMMAND_FILE" | awk 'BEGIN{RS="";FS="\n"}{print}' | while read -r block
              do

                hash=$(echo "$block" | sha256sum | cut -d" " -f1)

                if ! grep -q "$hash" "$HISTORY_FILE"; then

                  echo "========== NEW COMMAND =========="
                  echo "$block"
                  echo "================================="

                  bash -c "$block" || echo "Command failed"

                  echo "$hash" >> "$HISTORY_FILE"

                  git add "$HISTORY_FILE"
                  git commit -m "executed command $hash" || true
                  git push origin main || true

                fi

              done

            fi

            sleep 20

          done
