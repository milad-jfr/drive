name: Run Commands

on:
  push:
    paths:
      - 'command.txt'

jobs:
  run-commands:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Execute command blocks
        shell: bash
        run: |

          COMMAND_FILE="command.txt"

          echo "Running commands from $COMMAND_FILE"

          awk '/### COMMAND/{flag=1;next}/### END/{flag=0;print "###BLOCK_END###"}flag' "$COMMAND_FILE" \
          | awk 'BEGIN{RS="###BLOCK_END###"}{print}' \
          | while read -r block
          do
            if [ -n "$block" ]; then
              echo "===================="
              echo "Executing:"
              echo "$block"
              echo "===================="

              bash -c "$block" || echo "Command failed"
            fi
          done
