name: Smart Worker (Persistent Request Processor)

on:
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm init -y
          npm install node-fetch@3

      - name: Start Persistent Worker
        shell: bash
        run: |
          set +e

          REQUEST_FILE="bridge/request.json"
          RESULT_FILE="bridge/result.json"
          STATE_FILE=".last_request_hash"

          mkdir -p bridge
          touch "$STATE_FILE"

          echo "🚀 Persistent Worker Started..."

          while true
          do
            echo "===================================="
            echo "🔄 Syncing repository..."
            git fetch origin main || echo "⚠️ git fetch failed"
            git reset --hard origin/main || echo "⚠️ git reset failed"

            if [ -f "$REQUEST_FILE" ]; then
              current_hash=$(sha256sum "$REQUEST_FILE" | cut -d" " -f1)
              last_hash=$(cat "$STATE_FILE" 2>/dev/null || echo "")

              if [ "$current_hash" != "$last_hash" ]; then
                echo "⚡ New request detected..."

                echo "$current_hash" > "$STATE_FILE"

                # اجرای worker
                node bridge/worker.js "$REQUEST_FILE" "$RESULT_FILE" || echo "⚠️ Worker execution failed"

                # بعد از پردازش، request را پاک کن تا برای درخواست بعدی آماده شود
                rm -f "$REQUEST_FILE"

                # commit فقط result و state
                git add "$RESULT_FILE" "$STATE_FILE" || echo "⚠️ git add failed"
                git commit -m "Update result" || echo "ℹ️ Nothing to commit"
                git push origin main || echo "⚠️ git push failed"

                echo "✅ Request processed."
              else
                echo "🌀 No new request (hash unchanged)."
              fi
            else
              echo "📭 No request file found."
            fi

            echo "⏳ Sleeping 5 seconds..."
            sleep 5
          done
