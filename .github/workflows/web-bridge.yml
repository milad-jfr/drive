name: Smart Worker (Persistent Request Processor)

on:
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start Persistent Worker
        shell: bash
        run: |

          REQUEST_FILE="bridge/request.json"
          RESULT_FILE="bridge/result.json"
          STATE_FILE=".last_request_hash"

          mkdir -p bridge
          touch "$STATE_FILE"

          echo "🚀 Persistent Worker Started..."

          while true
          do
            echo "🔄 Syncing repository..."
            git fetch origin main
            git reset --hard origin/main

            if [ -f "$REQUEST_FILE" ]; then

              current_hash=$(sha256sum "$REQUEST_FILE" | cut -d" " -f1)
              last_hash=$(cat "$STATE_FILE")

              if [ "$current_hash" != "$last_hash" ]; then
                echo "⚡ New request detected..."

                echo "$current_hash" > "$STATE_FILE"

                # اجرای worker
                node bridge/worker.js "$REQUEST_FILE" "$RESULT_FILE"

                git add "$RESULT_FILE" "$STATE_FILE"
                git commit -m "Update result" || true
                git push origin main || true

                echo "✅ Request processed."
              else
                echo "🌀 No new request."
              fi

            else
              echo "📭 No request file found."
            fi

            echo "⏳ Sleeping 30 seconds..."
            sleep 30
          done
