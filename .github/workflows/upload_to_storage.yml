name: Download File And Upload Artifact

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Download URL"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download file
        run: |
          mkdir download
          cd download
          echo "Downloading..."
          curl -L "${{ github.event.inputs.url }}" -o file

      - name: Show file info
        run: |
          ls -lh download

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: download/

      - name: Print download page
        run: |
          echo ""
          echo "===================================="
          echo "Artifact ready for download"
          echo ""
          echo "Open this page:"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "Scroll to the Artifacts section and download the file."
          echo "===================================="
