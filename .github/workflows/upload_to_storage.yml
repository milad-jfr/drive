name: Upload Test Artifact

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test file
        run: |
          echo "hello world" > test.txt

      - name: Upload artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: myfile
          path: test.txt

      - name: Print easy download link
        run: |
          echo "== Artifact Info =="
          echo "Artifact Name: myfile"
          echo ""
          echo "Run ID: ${{ github.run_id }}"
          echo "Repo: ${{ github.repository }}"
          echo ""

          # لینک قابل‌کلیک برای دانلود
          echo "Download Page:"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "در این صفحه بخش Artifacts را باز کن و روی myfile کلیک کن."
