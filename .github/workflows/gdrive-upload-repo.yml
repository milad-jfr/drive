name: Drive Download + Split + Chunked Push

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Google Drive direct/download link"
        required: true
        type: string

permissions:
  contents: write

jobs:
  process-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config http.maxRequestBuffer 200M

      - name: Install gdown
        run: pip install gdown

      - name: Detect default branch
        run: |
          branch="${{ github.event.repository.default_branch }}"
          echo "DEFAULT_BRANCH=$branch" >> $GITHUB_ENV

      - name: Download file from Drive
        run: |
          set -e
          before=$(mktemp)
          after=$(mktemp)

          find . -maxdepth 1 -type f -printf "%f\n" | sort > "$before"
          gdown "${{ github.event.inputs.drive_url }}" --no-cookies
          find . -maxdepth 1 -type f -printf "%f\n" | sort > "$after"

          filename=$(comm -13 "$before" "$after" | head -n 1)

          if [ -z "$filename" ]; then
            echo "Download failed"
            exit 1
          fi

          echo "FILE_NAME=$filename" >> $GITHUB_ENV
          echo "Downloaded file: $filename"
          ls -lh "$filename"

      - name: Split if needed
        run: |
          set -e
          size=$(stat -c%s "$FILE_NAME")
          limit=$((95*1024*1024))

          if [ "$size" -lt "$limit" ]; then
            echo "File smaller than 95MB, skipping split"
            echo "$FILE_NAME" > upload_list.txt
          else
            echo "Splitting file..."
            prefix="${FILE_NAME}.part_"
            split -b 90M "$FILE_NAME" "$prefix"
            ls -lh ${FILE_NAME}.part_*
            ls ${FILE_NAME}.part_* > upload_list.txt
          fi

      - name: Stage and push in batches
        run: |
          set -e
          batch_size=30
          counter=0
          branch="$DEFAULT_BRANCH"

          git fetch origin "$branch" || true

          while read file; do
            if git ls-tree -r "origin/$branch" --name-only | grep -Fxq "$file"; then
              echo "Skip existing: $file"
              continue
            fi

            git add "$file"
            counter=$((counter+1))

            if [ "$counter" -ge "$batch_size" ]; then
              if ! git diff --cached --quiet; then
                git commit -m "Add $counter files batch"
                git push origin HEAD:"$branch" || exit 1
              fi
              counter=0
            fi
          done < upload_list.txt

          if ! git diff --cached --quiet; then
            git commit -m "Final batch"
            git push origin HEAD:"$branch" || exit 1
          fi
