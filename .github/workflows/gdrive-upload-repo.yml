name: Drive Download + Split + Chunked Push

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Google Drive direct/download link"
        required: true
        type: string

permissions:
  contents: write

jobs:
  process-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config http.maxRequestBuffer 200M

      - name: Install gdown
        run: pip install gdown

      - name: Detect default branch
        run: |
          branch="${{ github.event.repository.default_branch }}"
          echo "DEFAULT_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "Default branch: $branch"

      - name: Download file from Drive
        run: |
          set -e
          echo "Downloading file..."
          before=$(mktemp)
          after=$(mktemp)

          find . -maxdepth 1 -type f ! -name "$before" ! -name "$after" -printf "%f\n" | sort > "$before"
          gdown "${{ github.event.inputs.drive_url }}" --no-cookies
          find . -maxdepth 1 -type f ! -name "$before" ! -name "$after" -printf "%f\n" | sort > "$after"

          filename=$(comm -13 "$before" "$after" | head -n 1)

          if [ -z "$filename" ]; then
            echo "Could not detect downloaded file"
            exit 1
          fi

          echo "FILE_NAME=$filename" >> "$GITHUB_ENV"
          echo "Downloaded file: $filename"
          ls -lh "$filename"

      - name: Split into chunks <100MB
        run: |
          set -e
          rm -f part_* || true
          echo "Splitting file: $FILE_NAME"
          split -b 90M "$FILE_NAME" part_
          echo "Chunks created:"
          ls -lh part_*

      - name: Stage and push chunks in batches
        run: |
          set -e
          batch_size=30
          counter=0
          branch="$DEFAULT_BRANCH"

          git fetch origin "$branch" || true

          for file in part_*; do
            if git ls-tree -r "origin/$branch" --name-only | grep -Fxq "$file"; then
              echo "Skip already uploaded: $file"
              continue
            fi

            git add "$file"
            counter=$((counter + 1))

            if [ "$counter" -ge "$batch_size" ]; then
              if git diff --cached --quiet; then
                echo "Nothing to commit in this batch"
              else
                git commit -m "Add $counter chunks batch"
                echo "Pushing batch..."
                if git push origin HEAD:"$branch"; then
                  echo "Batch OK"
                else
                  echo "Push failed, resume on next run"
                  exit 1
                fi
              fi
              counter=0
            fi
          done

          if git diff --cached --quiet; then
            echo "No remaining chunks to commit"
          else
            git commit -m "Final batch"
            git push origin HEAD:"$branch" || {
              echo "Final push failed, will resume next time"
              exit 1
            }
          fi
