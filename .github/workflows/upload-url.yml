name: Drive To Repo Chunked Uploader

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Google Drive File ID"
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup git identity
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com

      - name: Load upload state
        id: state
        run: |
          if [ -f .upload_state ]; then
            source .upload_state
          else
            NEXT_PART=0
          fi
          echo "next_part=$NEXT_PART" >> $GITHUB_OUTPUT

      - name: First HTML request, get cookies
        run: |
          FILE_ID=${{ github.event.inputs.file_id }}
          curl -s -c cookies.txt "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o page1.html

      - name: Parse Drive HTML & Get real download link or confirm token
        id: link
        run: |
          # تلاش برای پیدا کردن لینک واقعی دانلود
          LINK=$(grep -o 'https://drive.usercontent.google.com/download[^"]*' page1.html | head -n1)
          if [ -z "$LINK" ]; then
            # اگر نبود، باید confirm token را بگیریم
            CONFIRM=$(grep -o 'confirm=[^&"]*' page1.html | head -n1 | cut -d= -f2)
            FILE_ID=${{ github.event.inputs.file_id }}
            curl -s -b cookies.txt -c cookies.txt \
              "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" \
              -o page2.html
            LINK=$(grep -o 'https://drive.usercontent.google.com/download[^"]*' page2.html | head -n1)
          fi
          if [ -z "$LINK" ]; then
            echo "❌  Download link not found!"
            exit 1
          fi
          echo "real_link=$LINK" >> $GITHUB_OUTPUT

      - name: Download 50MB chunk (no -L!)
        id: dl
        run: |
          PART=${{ steps.state.outputs.next_part }}
          CHUNK_SIZE=$((50*1024*1024))
          START=$((PART*CHUNK_SIZE))
          END=$((START+CHUNK_SIZE-1))
          echo "Downloading chunk [$START-$END] (part $PART)"

          curl -s \
            -b cookies.txt \
            -H "Range: bytes=${START}-${END}" \
            "${{ steps.link.outputs.real_link }}" \
            -o chunk_${PART}.bin
          
          BYTES=$(stat -c%s chunk_${PART}.bin)
          echo "chunk_bytes=$BYTES" >> $GITHUB_OUTPUT
          # اگر سایز فایل کوچکتر از 1MB شد احتمالا تمام شده (یا مشکل)
          if [ "$BYTES" -lt 1000000 ]; then
            echo "finished=true" >> $GITHUB_OUTPUT
          else
            echo "finished=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if file finished
        if: steps.dl.outputs.finished == 'true'
        run: echo "File fully downloaded! Workflow finished."

      - name: Commit and push chunk
        if: steps.dl.outputs.finished == 'false'
        run: |
          PART=${{ steps.state.outputs.next_part }}
          git add chunk_${PART}.bin
          git commit -m "Upload chunk $PART"
          git push

      - name: Advance upload state
        if: steps.dl.outputs.finished == 'false'
        run: |
          PART=${{ steps.state.outputs.next_part }}
          NEXT=$((PART+1))
          echo "NEXT_PART=$NEXT" > .upload_state
          git add .upload_state
          git commit -m "Update upload state, part $NEXT"
          git push
