name: Full Download → Chunk → Upload

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Google Drive file ID"
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com

      - name: Load state
        id: state
        run: |
          if [ -f .upload_state ]; then
            source .upload_state
          else
            PART_INDEX=0
          fi
          echo "part=$PART_INDEX" >> $GITHUB_OUTPUT

      - name: Install gdown (simple Google Drive downloader)
        run: |
          pip install gdown

      - name: Download full file from Drive
        run: |
          FILE_ID="${{ github.event.inputs.file_id }}"
          echo "Downloading full file..."
          gdown "https://drive.google.com/uc?id=${FILE_ID}" -O full.bin
          echo "Download completed."

      - name: Chunk & Upload parts
        id: process
        run: |
          PART=${{ steps.state.outputs.part }}
          SIZE_PER_PART=$((1024*1024*1024))    # 1GB per part
          FILE_SIZE=$(stat -c%s "full.bin")

          echo "Full file size: $FILE_SIZE bytes"
          echo "Current part index: $PART"

          START=$((PART * SIZE_PER_PART))

          if [ $START -ge $FILE_SIZE ]; then
            echo "finished=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          END=$((START + SIZE_PER_PART))
          if [ $END -gt $FILE_SIZE ]; then
            END=$FILE_SIZE
          fi

          PART_FILENAME="part_${PART}.bin"

          echo "Extracting bytes $START to $END → $PART_FILENAME"

          dd if="full.bin" of="$PART_FILENAME" bs=1 skip=$START count=$((END - START)) status=none

          echo "finished=false" >> $GITHUB_OUTPUT

      - name: Commit & Push chunk
        if: steps.process.outputs.finished == 'false'
        run: |
          PART=${{ steps.state.outputs.part }}
          git add "part_${PART}.bin"
          git commit -m "Upload part $PART"
          git push

      - name: Update state
        if: steps.process.outputs.finished == 'false'
        run: |
          PART=${{ steps.state.outputs.part }}
          NEXT=$((PART+1))
          echo "PART_INDEX=$NEXT" > .upload_state
          git add .upload_state
          git commit -m "State update: part $NEXT"
          git push

      - name: Done
        if: steps.process.outputs.finished == 'true'
        run: echo "All parts uploaded. Completed."
