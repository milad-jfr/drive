name: Drive Chunk Upload

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Google Drive File ID"
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Read state
        id: state
        run: |
          if [ -f .upload_state ]; then
            source .upload_state
          else
            NEXT_PART=0
          fi
          echo "part=$NEXT_PART" >> $GITHUB_OUTPUT

      - name: Get download page
        run: |
          FILE_ID=${{ github.event.inputs.file_id }}

          curl -L -s -c cookies.txt \
          "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
          -o page.html

      - name: Extract real download link
        id: link
        run: |

          LINK=$(grep -o 'https://drive.usercontent.google.com/download[^"]*' page.html | head -n1)

          if [ -z "$LINK" ]; then
            CONFIRM=$(grep -o 'confirm=[^&"]*' page.html | head -n1 | cut -d= -f2)

            FILE_ID=${{ github.event.inputs.file_id }}

            curl -L -s -b cookies.txt -c cookies.txt \
            "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" \
            -o page2.html

            LINK=$(grep -o 'https://drive.usercontent.google.com/download[^"]*' page2.html | head -n1)
          fi

          echo "link=$LINK" >> $GITHUB_OUTPUT
          echo "Download link found"

      - name: Download chunk
        id: download
        run: |

          PART=${{ steps.state.outputs.part }}

          CHUNK=$((50*1024*1024))
          START=$((PART*CHUNK))
          END=$((START+CHUNK-1))

          echo "Downloading chunk $PART ($START-$END)"

          curl -L \
          -b cookies.txt \
          -H "Range: bytes=${START}-${END}" \
          "${{ steps.link.outputs.link }}" \
          -o chunk_${PART}.bin

          SIZE=$(stat -c%s chunk_${PART}.bin)

          echo "Chunk size $SIZE"

          if [ "$SIZE" -lt 1000 ]; then
            echo "stop=true" >> $GITHUB_OUTPUT
          else
            echo "stop=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if finished
        if: steps.download.outputs.stop == 'true'
        run: |
          echo "Download finished"

      - name: Commit chunk
        if: steps.download.outputs.stop == 'false'
        run: |
          PART=${{ steps.state.outputs.part }}

          git add chunk_${PART}.bin
          git commit -m "chunk $PART"
          git push

      - name: Update state
        if: steps.download.outputs.stop == 'false'
        run: |
          PART=${{ steps.state.outputs.part }}
          NEXT=$((PART+1))

          echo "NEXT_PART=$NEXT" > .upload_state

          git add .upload_state
          git commit -m "state $NEXT"
          git push
