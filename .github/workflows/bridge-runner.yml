name: Bridge Runner

on:
  push:
    paths:
      - 'bridge/queue/*.json'

jobs:
  process:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm install -g playwright
          playwright install chromium

      - name: Process queue files
        run: |
          for file in bridge/queue/*.json; do
            echo "Processing $file"

            id=$(jq -r '.id' "$file")
            url=$(jq -r '.url' "$file")

            outfile="bridge/results/${id}.html"

            node bridge/runner.js "$url" "$outfile"

            echo "Saved $outfile"
          done

      - name: Commit results
        run: |
          git config user.email "actions@github.com"
          git config user.name "Bridge Runner"

          git add bridge/results/ || true
          git rm bridge/queue/*.json || true

          git commit -m "Processed requests" || echo "Nothing to commit"

      - name: Push results
        run: git push
