name: Web Terminal via localhost.run

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install ttyd
        run: |
          sudo apt update
          sudo apt install -y ttyd

      - name: Start web terminal
        run: |
          ttyd -p 7681 bash &

      - name: Expose via localhost.run
        run: |
          echo "Creating public tunnel..."
          ssh -o StrictHostKeyChecking=no -R 80:localhost:7681 ssh.localhost.run
          
      - name: Keep alive
        run: |
          while true; do sleep 300; done
