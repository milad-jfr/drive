name: Persistent Debug Runner

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Start SSH Tunnel
        run: |
          # فعال کردن پسورد برای یوزر runner (پیش‌فرض گیت‌هاب)
          echo "runner:password" | sudo chpasswd
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart
          
          # اجرای تونل بدون نیاز به توکن
          cloudflared tunnel --url ssh://localhost:22 &
          
          # گرفتن آدرس عمومی
          echo "آدرس اتصال شما در خط زیر است (به دنبال آدرس trycloudflare.com بگردید):"
          sleep 10
          curl -s http://localhost:45678/quicktunnel | grep -o 'https://[^"]*.trycloudflare.com'
          
      - name: Keep alive
        run: sleep 36000
