name: Persistent Debug Runner

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false

      - name: Keep runner alive
        run: |
          echo "Runner is alive..."
          while true; do
            sleep 300
          done
