name: Web Terminal no-SSH

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Web Terminal (shellinabox)
        run: |
          sudo apt update
          sudo apt install -y shellinabox
          sudo sed -i 's/4200/8080/' /etc/default/shellinabox
          sudo systemctl restart shellinabox

      - name: Get runner IP
        id: ip
        run: |
          IP=$(curl -s ifconfig.me || curl -s https://api.ipify.org)
          echo "runner_ip=$IP" >> $GITHUB_OUTPUT

      - name: Show access URL
        run: |
          echo "Open this in your browser:"
          echo "https://${{ steps.ip.outputs.runner_ip }}:8080"

      - name: Keep alive
        run: |
          while true; do sleep 300; done
