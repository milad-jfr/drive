name: SSH Debug Runner

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Update system
        run: |
          sudo apt update
          sudo apt install -y curl

      - name: Start SSH via tmate
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          detached: false

      - name: Keep runner alive
        run: |
          echo "Runner is alive"
          while true; do
            sleep 300
          done
